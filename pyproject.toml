[project]
name = "pharmacy-inventory-prescription-management"
version = "1.0.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.115.6",
    "SQLAlchemy==2.0.36",
    "PyMySQL==1.1.1",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "pydantic[email]==2.10.4",
    "python-dotenv==1.0.1",
]

# Vercel reads this to load the FastAPI instance and to build the frontend
# before packaging the function.
[tool.vercel]
entrypoint = "server.py:app"

[tool.vercel.scripts]
build = "npm ci --prefix frontend && npm run build --prefix frontend"
